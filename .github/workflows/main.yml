
name: Build DeathDimension V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Source ZIP
        run: |
          mkdir -p source
          unzip -q DeathDimensionV2.1-7Seconds-FIXED-Source.zip -d source

      - name: Build JAR
        run: mvn -B -f source/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-V2.1-7Seconds
          path: source/target/*.jar
          if-no-files-found: error
